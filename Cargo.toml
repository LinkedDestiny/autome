[workspace]
resolver = "2"
members = ["crates/autome-domain", "crates/automed"]

[workspace.package]
edition = "2024"
rust-version = "1.93.1"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
toml = "0.8"
toml_edit = "0.22"
