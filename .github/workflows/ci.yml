# Quality gates from technical design §16. Everything here runs on every push;
# the two gates that cannot (T5's real CLIs, T6's screenshot comparison) are
# called out in the design as manual.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # A hung step must fail in minutes, not sit at the runner's own limit.
    timeout-minutes: 30
    # macOS because the product is macOS-only (plan D9) and because the git,
    # worktree and process tests exercise real platform behaviour. Running them
    # on Linux would test a platform we do not ship.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # T1: static gates. `-D warnings` because a warning that is allowed to
      # accumulate stops being read.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # T1/T2/T3: the unit suites. Git is present on the runner, so the git
      # and launcher tests run rather than skipping.
      - name: Test
        run: cargo test --workspace --all-targets

      # T7: the end-to-end suite, which drives a whole task to a merge commit
      # against a real repository with a stand-in for the model. Run
      # separately so a failure here is legible as "the loop broke" rather
      # than being buried in the unit output.
      - name: End to end
        run: cargo test --test end_to_end -- --nocapture

      # T5, the free half: ask each installed CLI for its own --help and check
      # every flag the adapter table passes appears in it. Costs nothing and
      # needs no account, and would have caught the `-p` bug that made every
      # session hang. Skips whichever CLI the runner does not have.
      - name: Adapter flags exist
        run: cargo test --test real_cli every_adapter_flag -- --nocapture

  web:
    timeout-minutes: 15
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    # A hung step must fail in minutes, not sit at the runner's own limit.
    # The desktop job once held a runner for 45 minutes on a test that takes
    # under two seconds locally.
    timeout-minutes: 20
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: apps/desktop
        run: npm ci || npm install
      # The suite's sidecar half drives the real core binary. Without it those
      # tests fail on their own precondition assert — the job would be red for
      # a reason that has nothing to do with the shell, or (before the fix that
      # came with this line) would hang until the runner's limit.
      - name: Build the core the sidecar tests drive
        run: cargo build -p automed
      # T4/T6: the IPC gates, the shell, and the renderer's screen tests
      # including the one-screen height measurement.
      - name: Test
        working-directory: apps/desktop
        run: npm test

  # The package is built on every push, unsigned. A build step that only ever
  # runs by hand breaks quietly and is discovered at release, which is the one
  # time it must not.
  package:
    # A hung step must fail in minutes, not sit at the runner's own limit.
    # The desktop job once held a runner for 45 minutes on a test that takes
    # under two seconds locally.
    timeout-minutes: 20
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: sh scripts/package.sh
      - name: The bundle carries a runnable core
        run: |
          app="apps/desktop/dist/mac-arm64/Autome.app"
          test -x "$app/Contents/Resources/core/automed"
          "$app/Contents/Resources/core/automed" --help < /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Autome-unsigned-dmg
          path: apps/desktop/dist/*.dmg
          retention-days: 7

  # The command line, as a user would get it: the release tarball, installed
  # from that tarball into an empty prefix, answering --version and help.
  # Uploaded so any push's binary can be tried without building it.
  cli-package:
    timeout-minutes: 20
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: sh scripts/package-cli.sh
      - name: Install from the tarball
        run: |
          prefix=$(mktemp -d)
          PREFIX="$prefix" sh scripts/install-cli.sh --from dist/autome-*.tar.gz
          "$prefix/autome" --version
          "$prefix/autome" help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: autome-cli
          path: dist/autome-*.tar.gz*
          retention-days: 7

  # A pushed `v*` tag publishes the CLI tarball as a release asset — the file
  # `install-cli.sh` downloads when it is run outside a checkout. Nothing else
  # creates a release; pushing the tag is the decision to ship.
  cli-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, cli-package]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autome-cli
          path: dist
      - name: The tag matches the crate version
        run: |
          ls dist/autome-"${GITHUB_REF_NAME#v}"-*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/autome-*.tar.gz*

  # A guard rather than a gate: the two allowlists in the desktop shell must
  # stay in step with the core's own read/write split. The desktop suite
  # already cross-checks the read side by parsing dispatch.rs; this job fails
  # loudly if the file it parses ever moves.
  contract:
    # A hung step must fail in minutes, not sit at the runner's own limit.
    # The desktop job once held a runner for 45 minutes on a test that takes
    # under two seconds locally.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The read allowlist's source of truth exists
        run: |
          test -f crates/automed/src/dispatch.rs
          grep -q 'pub const READ_METHODS' crates/automed/src/dispatch.rs
