# autome-v2 用自己的 Loop 开发自己（docs/plans/2026-11-10-web-dashboard-via-loop.md）。
# 只写覆盖项；未写的字段跟随 ~/.autome/config.toml。

[loop]
parallel = 3

# 2026-11-12 曾关闭宿主门禁（一天 102 次、18.6 小时，并发互相抢占）。
# 2026-11-13 恢复：T-60（合并后不重复跑）、T-47（门禁排队，同时只跑 1 个）、
# T-61（只在合并前跑一次）已合并。每个任务只在合并前跑一次完整门禁，
# 实现轮/审计轮/修复轮只跑里程碑验收与直接相关的测试。
[gate]
command = "sh scripts/ci-local.sh"
run = "before_merge"
timeout_minutes = 30
# 每轮快检（T-67）：实现轮 / 修复轮结束后宿主跑一次，热缓存约 6 秒。
# 格式、lint、类型问题当轮退回，不用等到合并前。新 worktree 第一次会先装 Web 依赖。
quick = 'cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && { [ -d apps/web/node_modules ] || (cd apps/web && npm ci); } && npm run lint --prefix apps/web && npm run typecheck --prefix apps/web'
quick_timeout_minutes = 10

# 2026-11-13 打开（T-70 合并队列已合并）：任务过了合并前门禁就直接合并，不再停在「等你合并」。
# 设计批准与 Bug 补充信息卡点不受影响。单个任务要停下：autome merge <任务> --cancel。
[merge]
auto = true

[retry]
attempts = 2
backoff_seconds = 60
