# autome-v2 用自己的 Loop 开发自己（docs/plans/2026-11-10-web-dashboard-via-loop.md）。
# 只写覆盖项；未写的字段跟随 ~/.autome/config.toml。

[loop]
parallel = 3

# 2026-11-12 曾关闭宿主门禁（一天 102 次、18.6 小时，并发互相抢占）。
# 2026-11-13 恢复：T-60（合并后不重复跑）、T-47（门禁排队，同时只跑 1 个）、
# T-61（只在合并前跑一次）已合并。每个任务只在合并前跑一次完整门禁，
# 实现轮/审计轮/修复轮只跑里程碑验收与直接相关的测试。
[gate]
command = "sh scripts/ci-local.sh"
run = "before_merge"
timeout_minutes = 30

[retry]
attempts = 2
backoff_seconds = 60
