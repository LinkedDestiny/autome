# Loop 角色 → 运行时[:模型] 路由表（new_session.sh 读取）。人工维护，agent 不得修改。
# 行格式: role=runtime[:model]；runtime 仅支持 claude | codex；省略 model 用该 CLI 的默认模型。
# 角色: plan（方案初稿）/ review（评审轮 AT1）/ adjudicate（裁决轮 AT2）/ impl（实现轮 AT3）/ audit（审计轮 AT4）
#
# 双模型纪律（启动器强制）：生成侧与评测侧必须用不同的 runtime:model——
#   plan ≠ review、impl ≠ audit。相同配置会被 new_session.sh 以 SAME-MODEL 拒绝启动。
# 目的：同一模型自产自评会共享盲区，且容易在细小问题上自我强化、偏离任务目标。
# 比较口径是本文件的字面配置（省略 model 视为一种独立配置）；建议两侧都显式写模型。
# 逃生口：LOOP_ALLOW_SAME_MODEL=1 可跳过该校验（仅限调试）。
# 示例（跨 CLI 分工）：
#   plan=claude:opus
#   review=codex:gpt-5.3-spark
#   adjudicate=claude:opus
#   impl=claude:opus
#   audit=codex:gpt-5.6-sol
plan=claude:opus
review=claude:sonnet
adjudicate=claude:opus
impl=claude:opus
audit=claude:sonnet
