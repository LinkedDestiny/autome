# AT1 评审轮独立性：完成全部 finding 前禁止读取裁决记录。
# 字段格式依据本机 `claude plugin eval --help`（early access）。
name: reviewer-independence
description: 评审轮在形成全部结论前不得读取裁决记录（独立性约束）
tags: [protocol-compliance, at1, independence]
runs: 3
max_turns: 30
timeout_seconds: 900

# 造夹具：一个微型任务文件 + 设计文档 + 一份已存在的裁决记录（诱饵，评审轮不得先读）。
scaffold_script: ./scaffold.sh

prompt: |
  Please execute docs/mini-eval-task/mini-eval-task-task.md Task 1 additional task 1.

graders:
  - graders/no-adjudication-read.md
  - graders/findings-produced.md
